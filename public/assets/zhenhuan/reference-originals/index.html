<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>血染甄嬛 · 原剧头像核对</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;background:#efe3c9;color:#3d281d;font-family:system-ui,"PingFang SC",sans-serif}header{max-width:1160px;margin:auto auto 22px}h1{margin:0 0 6px;font-family:serif}p{margin:0;color:#765d49}.grid{max-width:1160px;margin:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.card{margin:0;padding:14px;border:1px solid #d3bb93;border-radius:16px;background:#fffaf0}.crop{aspect-ratio:1;overflow:hidden;border-radius:50%;background:#ddd0b8}.crop img{width:100%;height:100%;object-fit:cover;display:block}.card figcaption{padding-top:10px}.card b{display:block;font-size:16px}.card small{color:#856b55}.huanbi{object-position:50% 36%}.yurao{object-position:50% 34%}.jingfei{object-position:35% 30%}.xiaoyunzi{object-position:42% 37%}.jinxi{object-position:76% 34%}.guojunwang{object-position:50% 34%}.sanage{object-position:50% 34%}.yelanyi{object-position:50% 25%}.qiguiren{object-position:50% 32%}.niangengyao{object-position:50% 35%}.zhenhuan{object-position:50% 28%}.huafei{object-position:50% 28%}
  </style>
</head>
<body>
  <header><h1>血染甄嬛 · 原剧头像核对</h1><p>第一批电视剧原图裁切预览；确认人物与造型后再作为生成参考，不直接用于正式头像。</p></header>
  <main class="grid">
